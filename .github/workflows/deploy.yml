name: Deploy Calories365 (host-runner)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Git pull → /var/www/calories365/src
        run: |
          set -euo pipefail
          cd /home/maxim/var/www/calories365/src
          git fetch origin main
          git reset --hard origin/main

      - name: Docker compose up --build (+scale, recreate)
        working-directory: /home/maxim/var/www/calories365
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker compose up -d --build --force-recreate --remove-orphans
          docker builder prune --filter "until=168h" --force

      - name: Laravel migrate --force
        working-directory: /home/maxim/var/www/calories365
        run: |
          set -euo pipefail
          docker compose exec -T calculator_php php artisan migrate --force --no-interaction

      # Filterable attributes of the products index live in config/scout.php; product
      # search fails without them. Idempotent, so it runs on every deploy.
      - name: Sync Meilisearch index settings
        working-directory: /home/maxim/var/www/calories365
        run: |
          set -euo pipefail
          docker compose exec -T calculator_php php artisan scout:sync-index-settings --no-interaction

      - name: Graceful restart Horizon
        working-directory: /home/maxim/var/www/calories365
        run: |
          docker compose exec -T calculator_horizon php artisan optimize:clear
          docker compose exec -T calculator_horizon php artisan horizon:terminate

      # storage is a volume shared with Horizon and the scheduler, which run as root
      # like the artisan commands above: a log file they create cannot be written by
      # php-fpm (www-data), and every log call of a web request then fails with 500.
      - name: Give storage back to php-fpm
        working-directory: /home/maxim/var/www/calories365
        run: |
          set -euo pipefail
          docker compose exec -T calculator_php sh -c 'ls -ln storage/logs || true'
          docker compose exec -T calculator_php chown -R www-data:www-data storage bootstrap/cache
